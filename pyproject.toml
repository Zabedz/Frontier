[project]
name = "frontier"
version = "0.0.0"
description = "Accuracy, latency, memory, and calibration frontier for compressed language models"
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = { text = "MIT" }

# Base dependencies install on a laptop with no GPU. Everything here must run the
# CPU smoke path. Exact versions are pinned by uv.lock, generated on the pod-target
# interpreter; the bounds below are the compatibility floor, not the pinned truth.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",          # parquet result store
    "pyyaml>=6",
    "pydantic>=2.7",
    "jsonschema>=4.21",     # validate variant configs against the JSON Schema
    "typer>=0.12",          # one command per variant row
    "rich>=13",
    "scipy>=1.13",          # bootstrap confidence intervals
    "scikit-learn>=1.5",    # calibration_curve cross-check
    "matplotlib>=3.9",      # reliability diagrams, frontier chart
    "datasets>=2.20",       # MMLU / MMLU-Redux / ARC loaders
]

[project.scripts]
frontier = "frontier.pipeline.cli:app"
frontier-quantize = "frontier.quantize.cli:app"

[dependency-groups]
# Calibration-metric oracles. torch-dependent and heavy (netcal pulls pyro +
# gpytorch), and only needed when the metric cross-checks run. Isolated so the
# base + dev install stays light. `uv sync --group oracles` when working on metrics.
oracles = [
    "torchmetrics>=1.4",    # calibration-error oracle (top-label, equal-width)
    "netcal>=1.3.6",        # equal-mass / adaptive ECE oracle (frozen upstream; pin)
]

# HF Track-A backend (transformers + torch). Out of base so `uv sync` stays light on
# a laptop; installed with `uv sync --group hf`. torch is already resolved via the
# oracles group (torchmetrics), so re-listing it here does not change resolution, only
# makes the group self-sufficient. transformers floors at 5.0: the backend uses the
# 5.x `dtype=` kwarg on from_pretrained. The backend imports transformers lazily, so
# base CI (without this group) still imports frontier.backends.hf.
hf = [
    "torch>=2.5",
    "transformers>=5.0",
    "accelerate>=0.34",
    "bitsandbytes>=0.43 ; sys_platform == 'linux'",  # NF4 / LLM.int8 (Track A); linux-only wheel
]

# The Track-B serving/quantise stack (vllm, llmcompressor, compressed-tensors,
# gptqmodel, torchao, llama-cpp-python) is intentionally NOT a locked group: it pins
# against the real CUDA build and its transformers (< 5, capped by llmcompressor)
# conflicts with the hf group's 5.x, so it is installed separately on the pod. The
# backends and producers import it lazily behind Any-typed seams, so the CPU checks
# pass without it. See docs/pod-setup.md for the versions and install order.

dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5",
    "pre-commit>=3.8",
    "types-pyyaml",
    "types-jsonschema",
    "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frontier"]

# ---------------------------------------------------------------------------
# ruff: lint + format, strict.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtin shadowing
    "C4",        # comprehensions
    "SIM",       # simplify
    "PTH",       # use pathlib
    "RUF",       # ruff-specific
    "TID",       # tidy imports
    "PL",        # pylint subset
    "NPY",       # numpy legacy
    "PD",        # pandas
    "ARG",       # unused arguments
]
ignore = [
    "PLR0913",   # many-argument functions are unavoidable in config-driven runners
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------------------
# mypy: strict, everything typed.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Heavy third-party stacks treated as untyped boundaries: lazily imported model,
# quantiser, and serving libraries, the columnar store, and the plotting surface.
# `follow_imports = skip` keeps the result identical whether or not the stack is
# installed (transformers 5.x ships partial py.typed hints, so without skip the strict
# check would pass on a base checkout but fail once the `hf` group is present).
# matplotlib ships partial hints whose gaps trip strict mode on Axes/Figure keyword
# arguments; the analysis code stays strict and only the matplotlib calls are skipped.
module = [
    "netcal.*",
    "vllm.*",
    "llmcompressor.*",
    "bitsandbytes.*",
    "torchao.*",
    "gptqmodel.*",
    "llama_cpp.*",
    "datasets.*",
    "transformers.*",
    "accelerate.*",
    "peft.*",
    "trl.*",
    "pyarrow.*",
    "matplotlib.*",
]
follow_imports = "skip"
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=frontier --cov-report=term-missing"
markers = [
    "gpu: requires a CUDA device (skipped in the local CPU smoke path)",
    "slow: excluded from the fast local loop",
]

[tool.coverage.report]
# The metric maths must not regress silently; hold its floor high in CI.
# Global floor is lower because runners and I/O are exercised on the pod, not in unit CI.
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
