# Reasoning profile. The sharpest test of the central hypothesis: does compression
# degrade calibration faster on harder, multi-step reasoning? Keeps a clean
# single-token confidence instrument by generating chain-of-thought first, then
# reading the answer-letter logprob after an "Answer:" trigger (CoT-then-answer).
#
# This arm needs autoregressive generation, so it is GPU-only (not CPU-smoke
# friendly) and costs more per item. It is therefore run on a SUBSET of items and
# on a REPRESENTATIVE subset of variants only, not the full grid. See the reasoning
# subset in docs/decisions.md:
#   fp16, int4-gptq, int4-nf4, ptq-3bit-torchao, qat-3bit-lora, distill-softlabel-topk
eval:
  task_name: gpqa            # GPQA-Diamond, or MMLU-Pro-with-CoT as the alternate
  split: test
  subset_size: 1000
  prompt_style: zeroshot
  scoring: letter_softmax     # read the single answer letter AFTER the CoT
  permutation_scheme: none    # generation cost forbids 4x; validate bias separately on a slice
  labels: raw
  cot: true
  seeds: [0]
