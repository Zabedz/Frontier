# The reference each variant's damage is measured against, keyed by inference backend.
#
# Bit width only means something paired with an implementation (docs/methodology.md
# section 1), and a Track-B ECE is not comparable to a Track-A one until the fidelity
# gate passes (docs/architecture.md), so llama.cpp and vLLM each carry their own
# reference instead of borrowing the HF fp16 row. Every other variant on a backend
# pairs against that backend's reference, so adding a variant needs no edit here.
#
# llama.cpp has no fp16 row, so q8_0 stands in as the highest-precision GGUF build.
# That makes the GGUF numbers a within-GGUF ladder rather than a loss against full
# precision, which is what the cross-runtime replication claim rests on.
#
# Variants on a backend with no entry are reported as skipped.

references:
  hf: fp16
  llama_cpp: gguf-q8_0
  vllm: fp16-vllm
  torchao: fp16       # torchao quantises the HF model on load, so its baseline is HF fp16

# Per-model overrides. A pair whose reference scores a different model is skipped, so the
# 0.5B student needs its own baselines here.
by_model:
  Qwen/Qwen2.5-0.5B-Instruct:
    hf: student-fp16
    torchao: student-fp16

# A second pair by family, beside the per-model reference. It may cross models: both models
# score the same items, so the pairing holds item for item. A distilled student is measured
# against the teacher's fp16 row (what compressing the 3B into the 0.5B cost), and so is the
# off-the-shelf 0.5B, the baseline for reading those pairs.
also_by_family:
  distill:
    hf: fp16
  baseline:
    hf: fp16
