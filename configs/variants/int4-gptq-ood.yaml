name: int4-gptq-ood
family: ptq
track: B
backend:
  inference_backend: vllm
  weight_dtype: int4
  kv_cache_dtype: fp16
  gpu_offload_layers: -1
quant:
  method: llmcompressor-gptq
  bit_width: 4
  group_size: 128
  calibration_corpus: ood     # out-of-domain corpus, matched sample count and seqlen
  calibration_samples: 512
