name: distill-hardlabel
family: distill
track: A
model:                       # teacher distilled into the student; smoke swaps both
  model_id: Qwen/Qwen2.5-3B-Instruct
  student_id: Qwen/Qwen2.5-0.5B-Instruct
backend:
  inference_backend: hf
  weight_dtype: fp16
  kv_cache_dtype: fp16
  gpu_offload_layers: -1
distill:
  mode: hard_label           # cross-entropy on the teacher's top-1 token at each position
  top_k: 64                  # names the shared cache; the loss reads column 0
  corpus: fineweb_edu
  train_tokens: 30000000     # capped for the slow 16GB card; see the budget decision
  epochs: 1
  seq_len: 1024
  micro_batch_size: 4
  grad_accum: 4
  learning_rate: 1.0e-5
  warmup_fraction: 0.03
eval:
  seeds: [0, 1, 2]           # training randomness enters here, so >=3 seeds
# The no-soft-targets reference: the teacher's argmax on the same rows and positions as the
# soft-label student.
