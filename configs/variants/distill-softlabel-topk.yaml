name: distill-softlabel-topk
family: distill
track: A
model:                       # teacher distilled into the student; smoke swaps both
  model_id: Qwen/Qwen2.5-3B-Instruct
  student_id: Qwen/Qwen2.5-0.5B-Instruct
backend:
  inference_backend: hf
  weight_dtype: fp16
  kv_cache_dtype: fp16
  gpu_offload_layers: -1
distill:
  mode: soft_label_topk      # KL to the teacher's top-k probabilities plus one rest bucket
  top_k: 64                  # with corpus, train_tokens and seq_len, names the shared cache
  kd_temperature: 1.0        # the cache holds T=1 probabilities; T is recovered post hoc
  corpus: fineweb_edu
  train_tokens: 30000000     # capped for the slow 16GB card; see the budget decision
  epochs: 1
  seq_len: 1024
  micro_batch_size: 4
  grad_accum: 4              # 16 rows, 16,384 tokens per optimiser step (1,831 steps)
  learning_rate: 1.0e-5      # the 0.5B full-parameter QAT rate
  warmup_fraction: 0.03
eval:
  seeds: [0, 1, 2]           # training randomness enters here, so >=3 seeds
# The contribution vehicle: soft labels carry the teacher's uncertainty. All three student
# arms train full-parameter on the same cached rows and differ only in their targets.
